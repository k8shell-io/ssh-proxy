version: "2"
linters:
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
    staticcheck:
      checks:
        - all
        - -QF*
        - -ST*
  exclusions:
    rules:
      - linters:
          - errcheck
        text: "Error return value of `.*\\.Close` is not checked"
