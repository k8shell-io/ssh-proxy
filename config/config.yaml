# ssh-proxy service configuration

server:
  # port to bind the ssh-proxy server
  port: 2022
  
  # path to the SSH server private key file
  serverKey: ${SECRET_FILES}/server_key

  # true to start each connection in a new process
  forking: false

  # true to parse proxy protocol to get the real client IP and port
  # set to false when proxy protocol is not used
  proxyProtocol: true

  # options for the provision info writer
  writerOptions:
    showProvisionInfo: false
    showPulse: true
    showPercentage: true
    showErrors: true
    showSystemErrors: false

  # SSH handshake timeout in seconds
  SSHHandshakeTimeout: 15

  # maximum number of direct TCP/IP connections allowed (per ssh connection)
  maxDirectTCPIPConnections: 15

  # sftp binary path in the workspace
  sftpBinary: /usr/local/bin/sftp

  # publish SSH authentication failures to NATS
  publishSshFailures:
    enabled: false
    subject: ssh.failures
    publicIPOnly: false

  # enable/disable session recording per stream type
  # requires session to be configured
  recording:
    recordShell: true
    recordExec: false
    recordSFTP: false
    recordDirectTCPIP: true

# gRPC control interface (sshproxy.v1.SSHProxyService).
# Opt-in: omit this block or leave port unset/0 to disable it.
grpc:
  port: 9050
  enableTLS: false
  # certFile: /opt/shared/ssh-proxy/tls/tls.crt
  # keyFile: /opt/shared/ssh-proxy/tls/tls.key

  # JWT required claims for authentication
  authEnabled: false
  audience: ssh-proxy
  # allowed:
  #   - serviceAccount: api-server

nats:
  enabled: false
  url: nats://${NATS_HOST}:4222
  username: sshproxy
  password: !file ${SECRET_FILES}/sshproxy_nats_token

identity:
  address: identity.k8shell-staging:9020 #identity.k8shell-test:9020
  tokenFilePath: /opt/shared/auth/api-server/identity-token
  # caCertPath: /opt/shared/auth/ca.crt
  # serverName: identity.k8shell-test.svc

# authz service - leave address empty to disable authorization checks
authz:
  # address: authz.k8shell-staging:9040
  # tokenFilePath: /opt/shared/auth/api-server/authz-token
  # caCertPath: /opt/shared/auth/ca.crt
  # serverName: authz.k8shell-staging.svc

