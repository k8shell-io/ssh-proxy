# ssh-proxy service configuration

server:
  # true to start each connection in a new process
  forking: true

  # true to parse proxy protocol to get the real client IP and port
  # set to false when proxy protocol is not used
  proxyProtocol: false

  # true to show provision info when starting a shell
  showProvisionInfo: true

# ssh proxy configuration
ssh:
  port: 2022
  serverKey: ${SECRET_FILES}/server_key

# Identity service configuration
identity:
  baseURL: http://10.42.3.4:9090
  APIKey: !file ${SECRET_FILES}/identity_key
  timeout: 1000 

provisioner:
  baseURL: http://10.42.2.240:9201
  APIKey: !file ${SECRET_FILES}/provisioner_key
  timeout: 30000

